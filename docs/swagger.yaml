basePath: /api/v1
definitions:
  handler.addCartItemRequest:
    properties:
      product_id:
        type: integer
      quantity:
        type: integer
    type: object
  handler.adjustInventoryRequest:
    properties:
      product_id:
        type: integer
      quantity_delta:
        type: integer
      reserved_delta:
        type: integer
      store_id:
        type: string
    type: object
  handler.createOrderRequest:
    properties:
      delivery_fee_cents:
        type: integer
      store_id:
        type: string
    type: object
  handler.productRequest:
    properties:
      category:
        type: string
      currency:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price_cents:
        type: integer
      sku:
        type: string
    type: object
  handler.tokenRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  handler.updateCartItemRequest:
    properties:
      quantity:
        type: integer
    type: object
  handler.updateOrderStatusRequest:
    properties:
      status:
        type: string
    type: object
  handler.webhookRequest:
    properties:
      order_id:
        type: integer
      status:
        type: string
    type: object
  httpx.ErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  httpx.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/httpx.ErrorDetail'
    type: object
  model.Cart:
    properties:
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/model.CartItem'
        type: array
      total_cents:
        type: integer
      user_id:
        type: integer
    type: object
  model.CartItem:
    properties:
      id:
        type: integer
      line_total_cents:
        type: integer
      name:
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
      sku:
        type: string
      unit_price_cents:
        type: integer
    type: object
  model.InventoryLevel:
    properties:
      available:
        type: integer
      product_id:
        type: integer
      quantity:
        type: integer
      reserved:
        type: integer
      store_id:
        type: string
      updated_at:
        $ref: '#/definitions/model.Timestamp'
    type: object
  model.Order:
    properties:
      created_at:
        $ref: '#/definitions/model.Timestamp'
      currency:
        type: string
      delivery_fee_cents:
        type: integer
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/model.OrderItem'
        type: array
      status:
        type: string
      store_id:
        type: string
      subtotal_cents:
        type: integer
      total_cents:
        type: integer
      updated_at:
        $ref: '#/definitions/model.Timestamp'
      user_id:
        type: integer
    type: object
  model.OrderItem:
    properties:
      id:
        type: integer
      name:
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
      sku:
        type: string
      total_cents:
        type: integer
      unit_price_cents:
        type: integer
    type: object
  model.Payment:
    properties:
      amount_cents:
        type: integer
      created_at:
        $ref: '#/definitions/model.Timestamp'
      id:
        type: integer
      order_id:
        type: integer
      provider:
        type: string
      reference:
        type: string
      status:
        type: string
      updated_at:
        $ref: '#/definitions/model.Timestamp'
    type: object
  model.Product:
    properties:
      category:
        type: string
      created_at:
        $ref: '#/definitions/model.Timestamp'
      currency:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      price_cents:
        type: integer
      sku:
        type: string
      updated_at:
        $ref: '#/definitions/model.Timestamp'
    type: object
  model.Timestamp:
    properties:
      time.Time:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: QMart
  description: 'Quick-commerce backend: catalog, cart, orders, payments and per-store
    inventory.'
  license:
    name: MIT
  title: QMart API
  version: "1.0"
paths:
  /auth/token:
    post:
      consumes:
      - application/json
      description: Creates (or fetches) the user and returns a signed bearer token.
        Admin emails (QMART_ADMIN_EMAILS) receive the admin role.
      parameters:
      - description: email + name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.tokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Issue an access token
      tags:
      - auth
  /cart:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Cart'
      security:
      - BearerAuth: []
      summary: Get cart
      tags:
      - cart
  /cart/items:
    post:
      consumes:
      - application/json
      parameters:
      - description: product + quantity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.addCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Cart'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add item to cart
      tags:
      - cart
  /cart/items/{id}:
    delete:
      parameters:
      - description: cart item id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Cart'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove cart item
      tags:
      - cart
    put:
      consumes:
      - application/json
      parameters:
      - description: cart item id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: quantity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Cart'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update cart item
      tags:
      - cart
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /inventory:
    post:
      consumes:
      - application/json
      parameters:
      - description: stock deltas
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.adjustInventoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.InventoryLevel'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Adjust inventory (admin)
      tags:
      - inventory
  /inventory/{id}:
    get:
      parameters:
      - description: product id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.InventoryLevel'
            type: array
      security:
      - BearerAuth: []
      summary: Get inventory for a product
      tags:
      - inventory
  /orders:
    get:
      parameters:
      - description: page size
        in: query
        name: limit
        type: integer
      - description: keyset cursor
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Order'
            type: array
      security:
      - BearerAuth: []
      summary: List orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      parameters:
      - description: store + delivery fee
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Order'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Checkout cart into an order
      tags:
      - orders
  /orders/{id}:
    get:
      parameters:
      - description: order id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Order'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get order
      tags:
      - orders
  /orders/{id}/payments:
    post:
      parameters:
      - description: order id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Payment'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create payment for an order
      tags:
      - payments
  /orders/{id}/status:
    post:
      consumes:
      - application/json
      parameters:
      - description: order id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: target status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Order'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update order status (admin)
      tags:
      - orders
  /payments/webhook:
    post:
      consumes:
      - application/json
      parameters:
      - description: order + status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.webhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Payment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Payment webhook (simulated provider callback)
      tags:
      - payments
  /products:
    get:
      parameters:
      - description: filter by category
        in: query
        name: category
        type: string
      - description: case-insensitive name search
        in: query
        name: q
        type: string
      - description: page size (max 100)
        in: query
        name: limit
        type: integer
      - description: keyset cursor (last id from previous page)
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Product'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      parameters:
      - description: product
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.productRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create product (admin)
      tags:
      - products
  /products/{id}:
    delete:
      parameters:
      - description: product id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete product (admin)
      tags:
      - products
    get:
      parameters:
      - description: product id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Product'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get product
      tags:
      - products
    put:
      consumes:
      - application/json
      parameters:
      - description: product id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: product
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.productRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update product (admin)
      tags:
      - products
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
